<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Student Survey Form</h1>
    <p id="description">This form is to collect the student details to understand their skill set.</p>
    <form id="survey-form">
        <label for="name" id="name-label">Name</label>
        <input id="name" type="text" placeholder="Enter your name" name="name-label" required>
        <br>

        <label for="email" id="email-label">Email</label>
        <input id="email" type="email" placeholder="Enter your email" name="email-label" required>
        <br>

        <label for="number" id="number-label">Age (optional)</label>
        <input id="number" type="number" min="3" max="30" placeholder="age..." name="number-label"> 
        <br>

        <label for="dropdown">Your department</label>
        <select id="dropdown" name="dept">
            <option selected>Computer Science</option>
            <option>Electronics</option>
            <option>Electrical</option>
            <option>Mechanical</option>
        </select>

        <p>Gender</p>
        <input type="radio" name="gender" id="gender-male" value="gender-male">
        <label for="gender-male">Male</label>
        <input type="radio" name="gender" id="gender-female" value="gender-female">
        <label for="gender-female">Female</label>

        <p>Interests</p>
        <input type="checkbox" name="interests" id="web-dev" value="web-dev">
        <label for="web-dev">Web Development</label>
        <input type="checkbox" name="interests" id="mobile-dev" value="mobile-dev">
        <label for="mobile-dev">MobileDevelopment</label>
        <input type="checkbox" name="interests" id="ml" value="ml">
        <label for="ml">Machine Learning</label>
        
        <br>
        <label for="comments">Comments</label>
        <br>
        <textarea id="comments" placeholder="Enter your comments here.."></textarea>
        <br>

        <input type="submit" id="submit">

    </form>
  </body>
</html>
